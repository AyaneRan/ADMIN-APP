openapi: 3.0.3
info:
  title: Retail Management API
  version: 1.0.0
  description: >
    小売向け店舗マネジメントアプリ（単店舗先行）Sprint1向けAPI。
    対象: 認証、権限、監査、POS受信、売上取引、売上集計。
servers:
  - url: https://app.local/api
    description: 開発環境
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      summary: ログイン
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 認証成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      summary: ログアウト
      responses:
        '204':
          description: ログアウト完了
  /auth/otp/send:
    post:
      summary: OTP送信（初期2FA）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: OTP送信成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent:
                    type: boolean
        '404':
          description: ユーザー未登録
  /auth/otp/verify:
    post:
      summary: OTP検証
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp]
              properties:
                email:
                  type: string
                  format: email
                otp:
                  type: string
                  minLength: 6
                  maxLength: 8
      responses:
        '200':
          description: 検証成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
  /me:
    get:
      summary: ログインユーザー情報
      responses:
        '200':
          description: ユーザー情報取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
  /audit-logs:
    get:
      summary: 監査ログ一覧
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - name: from
          in: query
          description: 開始日時（ISO8601）
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: 終了日時（ISO8601）
          schema:
            type: string
            format: date-time
        - name: userId
          in: query
          schema:
            type: string
            format: uuid
        - name: entityType
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: 監査ログ一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogList'
    parameters: []
  /audit-logs/{id}:
    get:
      summary: 監査ログ詳細
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 監査ログ詳細
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLog'
  /pos/ingest:
    post:
      summary: POSイベント受信
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PosIngestBatchRequest'
      responses:
        '201':
          description: 受信完了
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: integer
                  queued:
                    type: integer
                  duplicated:
                    type: integer
                  failed:
                    type: integer
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PosIngestResult'
        '422':
          $ref: '#/components/responses/ValidationError'
  /pos/import-logs:
    get:
      summary: POS取り込み監査ログ検索
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - name: status
          in: query
          schema:
            type: string
            enum: [received, processed, failed, retrying, duplicated]
        - name: terminalId
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: 監査ログ一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosIngestLogList'
  /pos/import-logs/{id}/retry:
    post:
      summary: POS取り込み再試行
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '202':
          description: 再試行受付
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosIngestLog'
  /sales/transactions:
    get:
      summary: 取引一覧
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: staffId
          in: query
          schema:
            type: string
            format: uuid
        - name: paymentMethod
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, imported, posted, corrected, cancelled]
        - name: isRefund
          in: query
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: 取引一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesTransactionList'
  /sales/transactions/{id}:
    get:
      summary: 取引詳細
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 取引詳細
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesTransaction'
  /sales/transactions/{id}/correct:
    post:
      summary: 売上訂正申請
      description: 直接更新せず訂正申請として保存
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesCorrectionRequest'
      responses:
        '201':
          description: 訂正申請受理
        '403':
          description: 権限不足
  /sales/summary:
    get:
      summary: 売上集計
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: unit
          in: query
          required: false
          schema:
            type: string
            enum: [day, week, month]
        - name: categoryId
          in: query
          schema:
            type: string
            format: uuid
        - name: staffId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 集計結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesSummary'
  /sales/kpi:
    get:
      summary: 売上KPI
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: KPI集計
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesKpi'
  /sales/export:
    get:
      summary: 売上集計CSV出力
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: CSV
          content:
            text/csv:
              schema:
                type: string
  /dashboard/today:
    get:
      summary: ダッシュボード当日サマリ
      parameters:
        - $ref: '#/components/parameters/StoreId'
      responses:
        '200':
          description: 当日サマリ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardToday'
  /dashboard/alerts:
    get:
      summary: ダッシュボードアラート
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - name: severity
          in: query
          schema:
            type: string
            enum: [critical, warning, info]
      responses:
        '200':
          description: アラート一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardAlertList'
  /products:
    get:
      summary: 商品一覧
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - name: isActive
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: 商品一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductList'
    post:
      summary: 商品登録
      parameters:
        - $ref: '#/components/parameters/StoreId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '201':
          description: 登録成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
  /products/{id}:
    get:
      summary: 商品詳細
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 商品詳細
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
    patch:
      summary: 商品更新
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdate'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
  /products/{id}/toggle-active:
    patch:
      summary: 商品有効/無効切替
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToggleActiveRequest'
      responses:
        '200':
          description: 切替完了
  /products/import:
    post:
      summary: 商品CSV一括インポート
      parameters:
        - $ref: '#/components/parameters/StoreId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductImportRequest'
      responses:
        '202':
          description: 取り込み受理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductImportResult'
  /inventory/stocks:
    get:
      summary: 在庫一覧
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - name: q
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 在庫一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryStockList'
  /inventory/alerts:
    get:
      summary: 在庫アラート
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - name: alertType
          in: query
          schema:
            type: string
            enum: [shortage, expiring]
      responses:
        '200':
          description: 在庫アラート一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryAlertList'
  /inventory/movements:
    get:
      summary: 入出庫履歴
      parameters:
        - $ref: '#/components/parameters/StoreId'
      responses:
        '200':
          description: 入出庫一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryMovementList'
    post:
      summary: 在庫手入力補正
      parameters:
        - $ref: '#/components/parameters/StoreId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryMovementRequest'
      responses:
        '201':
          description: 補正登録済み
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryMovement'
  /inventory/counts:
    get:
      summary: 棚卸履歴
      parameters:
        - $ref: '#/components/parameters/StoreId'
      responses:
        '200':
          description: 棚卸履歴
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryCountList'
    post:
      summary: 棚卸開始/確定
      parameters:
        - $ref: '#/components/parameters/StoreId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryCount'
      responses:
        '201':
          description: 棚卸保存
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryCount'
  /inventory/counts/{id}/approve:
    patch:
      summary: 棚卸承認
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
      responses:
        '200':
          description: 承認済み
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryCount'
  /staff/schedules:
    get:
      summary: シフト一覧
      parameters:
        - $ref: '#/components/parameters/StoreId'
      responses:
        '200':
          description: シフト一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffScheduleList'
    post:
      summary: シフト登録
      parameters:
        - $ref: '#/components/parameters/StoreId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffSchedule'
      responses:
        '201':
          description: 登録完了
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffSchedule'
  /staff/schedules/{id}:
    patch:
      summary: シフト更新
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffSchedule'
      responses:
        '200':
          description: 更新完了
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffSchedule'
  /staff/attendance:
    get:
      summary: 勤務実績一覧
      parameters:
        - $ref: '#/components/parameters/StoreId'
      responses:
        '200':
          description: 勤務実績一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffAttendanceList'
    post:
      summary: 勤務入力
      parameters:
        - $ref: '#/components/parameters/StoreId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffAttendance'
      responses:
        '201':
          description: 登録完了
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffAttendance'
  /staff/attendance/{id}/approve:
    patch:
      summary: 勤務実績承認
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 承認完了
  /staff/payroll:
    get:
      summary: 人件費集計
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: 人件費一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffPayroll'
  /expenses:
    get:
      summary: 経費一覧
      parameters:
        - $ref: '#/components/parameters/StoreId'
      responses:
        '200':
          description: 経費一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseList'
    post:
      summary: 経費登録
      parameters:
        - $ref: '#/components/parameters/StoreId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Expense'
      responses:
        '201':
          description: 登録完了
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
  /expenses/{id}/approve:
    patch:
      summary: 経費承認
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 承認完了
  /expense-categories:
    get:
      summary: 経費科目一覧
      parameters:
        - $ref: '#/components/parameters/StoreId'
      responses:
        '200':
          description: 科目一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseCategoryList'
    post:
      summary: 経費科目登録
      parameters:
        - $ref: '#/components/parameters/StoreId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseCategory'
      responses:
        '201':
          description: 登録完了
  /reports/pnl:
    get:
      summary: 月次損益取得
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - name: targetMonth
          in: query
          required: true
          schema:
            type: string
            example: 2026-09
      responses:
        '200':
          description: 損益データ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PnLReport'
  /reports/month-close:
    post:
      summary: 月次ロック
      parameters:
        - $ref: '#/components/parameters/StoreId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonthCloseRequest'
      responses:
        '200':
          description: ロック結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthCloseResult'
  /reports/month-unlock:
    post:
      summary: 月次解除
      parameters:
        - $ref: '#/components/parameters/StoreId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonthCloseRequest'
      responses:
        '200':
          description: 解除結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthCloseResult'
  /reports/stores/comparison:
    get:
      summary: 店舗比較
      parameters:
        - name: storeIds
          in: query
          required: true
          schema:
            type: string
            description: カンマ区切りUUID
      responses:
        '200':
          description: 店舗比較結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreComparison'
  /inventory/cross-stores:
    get:
      summary: 店舗横断在庫
      parameters:
        - name: q
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 店舗横断在庫
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryCrossStore'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    StoreId:
      name: store_id
      in: query
      required: false
      description: 単店舗時は省略可（サーバ既定店舗を使用）
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: 未認証
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: 入力不正
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object
            additionalProperties: true
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    AuthSession:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [OWNER, MANAGER, STAFF, VIEWER]
        storeId:
          type: string
          format: uuid
        accessToken:
          type: string
    Me:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
        storeId:
          type: string
          format: uuid
    AuditLog:
      type: object
      properties:
        id:
