openapi: 3.0.3
info:
  title: Retail Management API
  version: 1.0.0
  description: >
    小売向け店舗マネジメントアプリ（単店舗先行）Sprint1向けAPI。
    対象: 認証、権限、監査、POS受信、売上取引、売上集計。
servers:
  - url: https://app.local/api
    description: 開発環境
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      summary: ログイン
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 認証成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      summary: ログアウト
      responses:
        '204':
          description: ログアウト完了
  /auth/otp/send:
    post:
      summary: OTP送信（初期2FA）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: OTP送信成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent:
                    type: boolean
        '404':
          description: ユーザー未登録
  /auth/otp/verify:
    post:
      summary: OTP検証
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp]
              properties:
                email:
                  type: string
                  format: email
                otp:
                  type: string
                  minLength: 6
                  maxLength: 8
      responses:
        '200':
          description: 検証成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
  /me:
    get:
      summary: ログインユーザー情報
      responses:
        '200':
          description: ユーザー情報取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
  /audit-logs:
    get:
      summary: 監査ログ一覧
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - name: from
          in: query
          description: 開始日時（ISO8601）
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: 終了日時（ISO8601）
          schema:
            type: string
            format: date-time
        - name: userId
          in: query
          schema:
            type: string
            format: uuid
        - name: entityType
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: 監査ログ一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogList'
    parameters: []
  /audit-logs/{id}:
    get:
      summary: 監査ログ詳細
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 監査ログ詳細
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLog'
  /pos/ingest:
    post:
      summary: POSイベント受信
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PosIngestBatchRequest'
      responses:
        '201':
          description: 受信完了
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: integer
                  queued:
                    type: integer
                  duplicated:
                    type: integer
                  failed:
                    type: integer
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PosIngestResult'
        '422':
          $ref: '#/components/responses/ValidationError'
  /pos/import-logs:
    get:
      summary: POS取り込み監査ログ検索
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - name: status
          in: query
          schema:
            type: string
            enum: [received, processed, failed, retrying, duplicated]
        - name: terminalId
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: 監査ログ一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosIngestLogList'
  /pos/import-logs/{id}/retry:
    post:
      summary: POS取り込み再試行
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '202':
          description: 再試行受付
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosIngestLog'
  /sales/transactions:
    get:
      summary: 取引一覧
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: staffId
          in: query
          schema:
            type: string
            format: uuid
        - name: paymentMethod
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, imported, posted, corrected, cancelled]
        - name: isRefund
          in: query
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: 取引一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesTransactionList'
  /sales/transactions/{id}:
    get:
      summary: 取引詳細
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 取引詳細
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesTransaction'
  /sales/transactions/{id}/correct:
    post:
      summary: 売上訂正申請
      description: 直接更新せず訂正申請として保存
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesCorrectionRequest'
      responses:
        '201':
          description: 訂正申請受理
        '403':
          description: 権限不足
  /sales/summary:
    get:
      summary: 売上集計
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: unit
          in: query
          required: false
          schema:
            type: string
            enum: [day, week, month]
        - name: categoryId
          in: query
          schema:
            type: string
            format: uuid
        - name: staffId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 集計結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesSummary'
  /sales/kpi:
    get:
      summary: 売上KPI
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: KPI集計
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesKpi'
  /sales/export:
    get:
      summary: 売上集計CSV出力
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: CSV
          content:
            text/csv:
              schema:
                type: string
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    StoreId:
      name: store_id
      in: query
      required: false
      description: 単店舗時は省略可（サーバ既定店舗を使用）
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: 未認証
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: 入力不正
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object
            additionalProperties: true
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    AuthSession:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [OWNER, MANAGER, STAFF, VIEWER]
        storeId:
          type: string
          format: uuid
        accessToken:
          type: string
    Me:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
        storeId:
          type: string
          format: uuid
    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        storeId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        entityType:
          type: string
        entityId:
          type: string
        action:
          type: string
          enum: [create, update, delete, approve, lock, unlock]
        before:
          type: object
        after:
          type: object
        ipAddress:
          type: string
        createdAt:
          type: string
          format: date-time
    AuditLogList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditLog'
        page:
          type: object
          properties:
            total:
              type: integer
            limit:
              type: integer
            offset:
              type: integer
    PosIngestBatchRequest:
      type: object
      properties:
        storeId:
          type: string
          format: uuid
        terminalId:
          type: string
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/PosTransactionEvent'
    PosTransactionEvent:
      type: object
      required:
        - transactionId
        - occurredAt
        - items
        - subtotal
        - totalAmount
      properties:
        transactionId:
          type: string
          description: 外部取引ID（POS側取引キー）
        sourceKey:
          type: string
          description: 冪等キー
        occurredAt:
          type: string
          format: date-time
        staffId:
          type: string
          format: uuid
        isRefund:
          type: boolean
          default: false
        subtotal:
          type: number
          format: double
        taxAmount:
          type: number
          format: double
        discountAmount:
          type: number
          format: double
        totalAmount:
          type: number
          format: double
        payment:
          type: array
          items:
            $ref: '#/components/schemas/PosPayment'
        items:
          type: array
          items:
            $ref: '#/components/schemas/PosTransactionItem'
    PosPayment:
      type: object
      properties:
        method:
          type: string
          description: payment method code/category id
        amount:
          type: number
          format: double
    PosTransactionItem:
      type: object
      properties:
        lineNo:
          type: integer
        productId:
          type: string
          format: uuid
        sku:
          type: string
        quantity:
          type: number
        unitPrice:
          type: number
        lineDiscount:
          type: number
        taxAmount:
          type: number
        lineTotal:
          type: number
    PosIngestLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sourceKey:
          type: string
        requestId:
          type: string
        status:
          type: string
          enum: [received, processed, failed, retrying, duplicated]
        errorCode:
          type: string
        errorMessage:
          type: string
        processedAt:
          type: string
          format: date-time
        receivedAt:
          type: string
          format: date-time
    PosIngestResult:
      type: object
      properties:
        sourceKey:
          type: string
        status:
          type: string
        errorCode:
          type: string
        transactionId:
          type: string
    PosIngestLogList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PosIngestLog'
        page:
          type: object
          properties:
            total:
              type: integer
            limit:
              type: integer
            offset:
              type: integer
    SalesTransaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        storeId:
          type: string
          format: uuid
        transactionNo:
          type: string
        externalTransactionId:
          type: string
        terminalId:
          type: string
        staffId:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        subtotal:
          type: number
          format: double
        taxAmount:
          type: number
          format: double
        discountAmount:
          type: number
          format: double
        totalAmount:
          type: number
          format: double
        isRefund:
          type: boolean
        status:
          type: string
        payments:
          type: array
          items:
            $ref: '#/components/schemas/SalesPayment'
        items:
          type: array
          items:
            $ref: '#/components/schemas/SalesItem'
    SalesTransactionList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SalesTransaction'
        page:
          type: object
          properties:
            total:
              type: integer
            limit:
              type: integer
            offset:
              type: integer
    SalesPayment:
      type: object
      properties:
        method:
          type: string
        amount:
          type: number
          format: double
    SalesItem:
      type: object
      properties:
        productId:
          type: string
          format: uuid
        sku:
          type: string
        quantity:
          type: number
        unitPrice:
          type: number
        lineDiscount:
          type: number
        taxAmount:
          type: number
        lineTotal:
          type: number
    SalesCorrectionRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 5
        requestedBy:
          type: string
          format: uuid
    SalesSummary:
      type: object
      properties:
        unit:
          type: string
          enum: [day, week, month]
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        totals:
          type: object
          properties:
            salesCount:
              type: integer
            saleAmount:
              type: number
              format: double
            taxAmount:
              type: number
              format: double
            discountAmount:
              type: number
              format: double
            refundAmount:
              type: number
              format: double
            grossProfit:
              type: number
              format: double
        rows:
          type: array
          items:
            type: object
            properties:
              bucket:
                type: string
              sales:
                type: number
                format: double
              cogs:
                type: number
                format: double
              grossProfit:
                type: number
                format: double
    SalesKpi:
      type: object
      properties:
        salesAmount:
          type: number
        salesCount:
          type: integer
        grossProfit:
          type: number
        grossMarginRate:
          type: number
        refundRate:
          type: number
        topProducts:
          type: array
          items:
            type: object
            properties:
              productId:
                type: string
                format: uuid
              productName:
                type: string
              amount:
                type: number
              unit:
                type: number
